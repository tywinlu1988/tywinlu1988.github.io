<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Paper Trail — a tiny platform adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#14110f; overflow:hidden; }
  body { font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  #game { display:block; background:#f5f1e8; border-radius:10px; box-shadow:0 16px 60px rgba(0,0,0,.6); max-width:100vw; }
  #touch { display:none; position:fixed; inset:auto 0 14px 0; justify-content:space-between; padding:0 16px; z-index:5; pointer-events:none; }
  .tbtn { pointer-events:auto; width:64px; height:64px; border-radius:50%; background:rgba(237,232,223,.12); border:1px solid rgba(237,232,223,.3); color:#ede8df; font-size:24px; display:flex; align-items:center; justify-content:center; user-select:none; touch-action:none; }
  .tbtn:active { background:rgba(224,85,85,.35); }
  .tr { display:flex; gap:12px; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch">
  <div class="tr"><div class="tbtn" id="bL">◀</div><div class="tbtn" id="bR">▶</div></div>
  <div class="tbtn" id="bJ">▲</div>
</div>
<script>
'use strict';
/* ================= 纸上大冒险 Paper Trail ================= */
/* 原生 canvas 平台跳跃：瓦片地图 + coyote time + 跳跃缓冲 + 粒子 + 视差 + 检查点 */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VIEW_W = 960, VIEW_H = 540;
const TILE = 30;
function fit() {
  const s = Math.min(innerWidth / VIEW_W, innerHeight / VIEW_H, 1.4);
  cv.width = VIEW_W * s; cv.height = VIEW_H * s;
  ctx.imageSmoothingEnabled = false;
}
fit(); addEventListener('resize', fit);

/* ---------- 关卡（ASCII 瓦片图） ----------
   # 纸墙  = 平台  ^ 墨水坑  * 星星  S 起点  F 旗帜  e 订书机巡逻兵  - 单行平台  C 检查点 */
const LEVELS = [
{
  name: 'Plains of Paper 纸之原',
  map: [
'                                                                              ',
'                                                                              ',
'                                                                              ',
'          *                                                                   ',
'         ===                                                                  ',
'                  *          e                                                ',
'    S            ====      ======          *                  C               ',
'  ######                    ^^^^^         ===              ======      *      ',
'  ######   *      e         #####                     e           ==== ===    ',
'######### ====== ######    #######  *   ##########  =======         F         ',
'#########        ######    ####### ===  ##########          *      ###        ',
'#########        #################      ##################  ###  #######      ',
'#########        #################      ##################  ###  #######      ',
'#########        #################      ##################  ###  #######      ',
],
},
{
  name: 'Manuscript Hills 稿纸山',
  map: [
'                                                                              ',
'                                                                              ',
'   S                                             *                            ',
'  #####                    e                    ===                           ',
'       ####    *      ==========     *                        e               ',
'           #  ===                 =======     *      ====================     ',
'           #        *      e            #    ====                 #           ',
'     C     #     ======  ########       #         #     *         #     *     ',
'    ====   #             ^^^^^^         ###   #######  ===   C    #    ===    ',
'           #    *        ######                #####         ==========       ',
'  *        #  =====      ######   e            #####              #####       ',
' ===    ####            ##############         #####    e         #####       ',
'               ^^^      ##############   *     #####  =====       #####  F    ',
'############  #####    ####################  ######          *  ####### ###  ',
'############  #####    ####################  ######  ###########  #####      ',
],
},
{
  name: 'Night Shift 编辑部夜班',
  map: [
'                                                                              ',
'                                                                              ',
' S                                *                          *                ',
'#####    *        e       ================      *       ==============        ',
'      ======  =========                   ==========                 *        ',
'           #          *      e      *                ^^^^   e       ===       ',
'     *     #  *   ========  =====  ====    *         ####  ======             ',
'    ===    # ===              #        ==========    ####           *         ',
'           #        e         #     *         ####    ####  C      ===        ',
'  *        #  ===========     #    ====       ####          =======           ',
' ====   ####           ###    #         *     ####    *          ####   *     ',
'              *        ###    #   ==========  ####  =======      ####  ===    ',
'       ==============  ###    #           #   ####          *    ####         ',
'   *              ###  ###  F #       *   #   ####    e    ===   ####         ',
'######  ########  ###  ### ####  =========#   ####  ======       ####         ',
'######  ########  ###  ### ####           #   ####           #########         ',
],
},
];

/* ---------- 状态 ---------- */
let level = 0, starsTotal = 0, levelStars = 0, totalTime = 0, levelTime = 0;
let started = false, finished = false, dead = false;
const CAM = { x: 0, y: 0 };

/* ---------- 输入 ---------- */
const keys = { left: false, right: false, jump: false };
let jumpBuf = 0;
function press(k) { if (k === 'jump') jumpBuf = 0.12; keys[k] = true; }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => {
  const k = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyR: 'restart' }[e.code];
  if (k) { e.preventDefault(); if (k === 'restart') { loadLevel(level, true); return; } if (!e.repeat) press(k); else keys[k] = true; }
});
addEventListener('keyup', e => {
  const k = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump' }[e.code];
  if (k) release(k);
});
const bind = (id, k) => {
  const el = document.getElementById(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); press(k); });
  el.addEventListener('pointerup', () => release(k));
  el.addEventListener('pointercancel', () => release(k));
  el.addEventListener('pointerleave', () => release(k));
};
bind('bL', 'left'); bind('bR', 'right'); bind('bJ', 'jump');

/* ---------- 物理常量 ---------- */
const GRAV = 0.42, RUN = 0.42, MAX_VX = 3.4, MAX_VY = 11, JUMP_V = -9.2, COYOTE = 0.09;

/* ---------- 实体 ---------- */
let grid = [], GW = 0, GH = 0;
const P = { x: 0, y: 0, w: 18, h: 24, vx: 0, vy: 0, onGround: false, coyote: 0, face: 1 };
let stars = [], foes = [], flags = [], checkpoints = [], spawn = { x: 0, y: 0 }, checkpoint = null;
let particles = [];

function tileAt(cx, cy) {
  if (cx < 0 || cx >= GW) return '#';
  if (cy >= GH) return '#';
  if (cy < 0) return ' ';
  return grid[cy][cx];
}
function solid(ch) { return ch === '#' || ch === '=' || ch === '-'; }

function loadLevel(n, keepTime) {
  const L = LEVELS[n];
  grid = L.map.map(r => r.split(''));
  GH = grid.length; GW = Math.max(...grid.map(r => r.length));
  grid = grid.map(r => { while (r.length < GW) r.push(' '); return r; });
  stars = []; foes = []; flags = []; checkpoints = []; particles = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const c = grid[y][x], px = x * TILE, py = y * TILE;
    if (c === '*') { stars.push({ x: px + 15, y: py + 15, got: false, t: Math.random() * 9 }); grid[y][x] = ' '; }
    if (c === 'S') { spawn = { x: px, y: py }; grid[y][x] = ' '; }
    if (c === 'F') { flags.push({ x: px, y: py, w: TILE, h: TILE * 2 }); grid[y][x] = ' '; }
    if (c === 'C') { checkpoints.push({ x: px, y: py, w: TILE, h: TILE * 2, on: false }); grid[y][x] = ' '; }
    if (c === 'e') { foes.push({ x: px, y: py + 8, w: 22, h: 22, vx: 0.8, alive: true, min: px - TILE * 2, max: px + TILE * 2 }); grid[y][x] = ' '; }
    if (c === '^') grid[y][x] = '^';
  }
  P.x = spawn.x; P.y = spawn.y; P.vx = 0; P.vy = 0;
  checkpoint = null; dead = false;
  if (!keepTime) levelTime = 0;
  levelStars = 0;
  CAM.x = Math.max(0, P.x - VIEW_W / 2); CAM.y = 0;
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: (Math.random() - .5) * 4, vy: -Math.random() * 3 - .5,
    life: 30 + Math.random() * 20, color, size: 2 + Math.random() * 3,
  });
}

/* ---------- 主循环 ---------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.033); last = now;
  if (started && !finished) update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  const steps = Math.max(1, Math.round(dt / 0.0166));
  for (let i = 0; i < steps; i++) step(1);
  // 粒子
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; }
  particles = particles.filter(p => p.life > 0);
  // 相机
  const tx = Math.max(0, Math.min(P.x + P.face * 60 - VIEW_W / 2, GW * TILE - VIEW_W));
  const ty = Math.max(0, Math.min(P.y - VIEW_H / 2, GH * TILE - VIEW_H));
  CAM.x += (tx - CAM.x) * 0.12; CAM.y += (ty - CAM.y) * 0.12;
}

function step(scale) {
  if (dead) return;
  levelTime += 1 / 60 * scale;

  // 水平
  if (keys.left) { P.vx -= RUN; P.face = -1; }
  if (keys.right) { P.vx += RUN; P.face = 1; }
  if (!keys.left && !keys.right) P.vx *= 0.8;
  P.vx = Math.max(-MAX_VX, Math.min(MAX_VX, P.vx));

  // 跳跃：缓冲 + coyote
  jumpBuf = Math.max(0, jumpBuf - 1 / 60);
  P.coyote = P.onGround ? COYOTE : Math.max(0, P.coyote - 1 / 60);
  if (jumpBuf > 0 && P.coyote > 0) {
    P.vy = JUMP_V; jumpBuf = 0; P.coyote = 0; P.onGround = false;
    burst(P.x + P.w / 2, P.y + P.h, '#d9a03f', 5);
  }
  if (!keys.jump && P.vy < -3) P.vy = -3; // 可变跳高

  P.vy = Math.min(P.vy + GRAV, MAX_VY);

  // 水平碰撞
  P.x += P.vx;
  let box = { x: P.x, y: P.y, w: P.w, h: P.h };
  forEachSolid(box, (c, tx, ty) => {
    if (P.vx > 0) P.x = tx * TILE - P.w - 0.01; else if (P.vx < 0) P.x = (tx + 1) * TILE + 0.01;
    P.vx = 0;
  });

  // 垂直碰撞
  const wasAir = !P.onGround;
  P.y += P.vy; P.onGround = false;
  box = { x: P.x, y: P.y, w: P.w, h: P.h };
  forEachSolid(box, (c, tx, ty) => {
    const isOneWay = c === '-' || c === '=';
    if (P.vy > 0) {
      if (isOneWay && (P.y + P.h - P.vy) > ty * TILE + 4) return; // 单 platform：只有从上落才站
      P.y = ty * TILE - P.h - 0.01; P.vy = 0; P.onGround = true;
    } else if (P.vy < 0 && !isOneWay) {
      P.y = (ty + 1) * TILE + 0.01; P.vy = 0;
    }
  });
  if (wasAir && P.onGround) burst(P.x + P.w / 2, P.y + P.h, '#c9c2b6', 4);

  // 墨水坑
  if (overlap({ x: P.x, y: P.y, w: P.w, h: P.h }, null, '^')) die();

  // 星星
  for (const st of stars) {
    if (!st.got && Math.abs(P.x + P.w / 2 - st.x) < 22 && Math.abs(P.y + P.h / 2 - st.y) < 24) {
      st.got = true; levelStars++; burst(st.x, st.y, '#d9a03f', 8);
    }
  }

  // 检查点
  for (const cp of checkpoints) {
    if (!cp.on && overlap({ x: P.x, y: P.y, w: P.w, h: P.h }, cp)) {
      cp.on = true; checkpoint = { x: cp.x, y: cp.y - P.h }; burst(cp.x + 15, cp.y, '#3fa873', 10);
    }
  }

  // 敌人
  for (const f of foes) {
    if (!f.alive) continue;
    f.x += f.vx;
    if (f.x < f.min || f.x > f.max) f.vx *= -1;
    if (overlap({ x: P.x, y: P.y, w: P.w, h: P.h }, f)) {
      if (P.vy > 1.5 && P.y + P.h - f.y < 14) { // 踩踏
        f.alive = false; P.vy = JUMP_V * 0.65; burst(f.x + 11, f.y, '#e05555', 10);
      } else die();
    }
  }

  // 旗帜
  for (const fl of flags) {
    if (overlap({ x: P.x, y: P.y, w: P.w, h: P.h }, fl)) {
      starsTotal += levelStars; totalTime += levelTime;
      burst(fl.x + 15, fl.y + 10, '#3fa873', 16);
      if (level < LEVELS.length - 1) { level++; loadLevel(level); }
      else finished = true;
    }
  }
}

function forEachSolid(box, cb) {
  const x0 = Math.max(0, Math.floor(box.x / TILE)), x1 = Math.min(GW - 1, Math.floor((box.x + box.w) / TILE));
  const y0 = Math.max(0, Math.floor(box.y / TILE)), y1 = Math.min(GH - 1, Math.floor((box.y + box.h) / TILE));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = tileAt(tx, ty);
    if (!solid(c)) continue;
    const t = { x: tx * TILE, y: ty * TILE, w: TILE, h: TILE };
    if (box.x < t.x + t.w && box.x + box.w > t.x && box.y < t.y + t.h && box.y + box.h > t.y) cb(c, tx, ty);
  }
}
function overlap(a, b, hazardCh) {
  if (hazardCh) {
    const x0 = Math.floor(a.x / TILE), x1 = Math.floor((a.x + a.w) / TILE);
    const y0 = Math.floor(a.y / TILE), y1 = Math.floor((a.y + a.h) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
      if (tileAt(tx, ty) === hazardCh) return true;
    return false;
  }
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function die() {
  burst(P.x + P.w / 2, P.y + P.h / 2, '#e05555', 14);
  P.x = checkpoint ? checkpoint.x : spawn.x;
  P.y = checkpoint ? checkpoint.y : spawn.y;
  P.vx = 0; P.vy = 0; CAM.x = Math.max(0, P.x - VIEW_W / 2);
}

/* ---------- 渲染 ---------- */
function render() {
  const s = cv.width / VIEW_W;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  // 纸天空 + 视差山
  ctx.fillStyle = '#f5f1e8'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  parallax('#e9e2d3', 0.15, 120, 260);
  parallax('#ddd3bf', 0.3, 70, 340);
  parallax('#cfc4ab', 0.5, 30, 430);
  ctx.save();
  ctx.translate(-CAM.x, -CAM.y);

  // 瓦片
  const x0 = Math.max(0, Math.floor(CAM.x / TILE)), x1 = Math.min(GW - 1, Math.ceil((CAM.x + VIEW_W) / TILE));
  const y0 = Math.max(0, Math.floor(CAM.y / TILE)), y1 = Math.min(GH - 1, Math.ceil((CAM.y + VIEW_H) / TILE));
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    const c = tileAt(tx, ty), px = tx * TILE, py = ty * TILE;
    if (c === '#') {
      ctx.fillStyle = '#3a2f26'; ctx.fillRect(px, py, TILE, TILE);
      ctx.fillStyle = '#4a3d31'; ctx.fillRect(px, py, TILE, 4);
    } else if (c === '=' || c === '-') {
      ctx.fillStyle = '#5a4a3a'; ctx.fillRect(px, py, TILE, 8);
    } else if (c === '^') {
      ctx.fillStyle = '#1c1917'; ctx.fillRect(px, py + TILE - 10, TILE, 10);
      ctx.fillStyle = '#e05555';
      ctx.fillRect(px + 3, py + TILE - 8, 4, 3); ctx.fillRect(px + 18, py + TILE - 9, 4, 3);
    }
  }

  // 星星
  for (const st of stars) {
    if (st.got) continue;
    st.t += 0.05;
    const r = 7 + Math.sin(st.t) * 1.5;
    ctx.fillStyle = '#d9a03f';
    ctx.save(); ctx.translate(st.x, st.y + Math.sin(st.t) * 2); ctx.rotate(Math.sin(st.t * 0.7) * 0.3);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      const a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // 检查点 / 旗帜
  for (const cp of checkpoints) {
    ctx.fillStyle = cp.on ? '#3fa873' : '#7a7367';
    ctx.fillRect(cp.x + 13, cp.y - 10, 3, cp.h + 10);
    ctx.beginPath(); ctx.moveTo(cp.x + 16, cp.y - 10); ctx.lineTo(cp.x + 36, cp.y - 3); ctx.lineTo(cp.x + 16, cp.y + 4); ctx.fill();
  }
  for (const fl of flags) {
    ctx.fillStyle = '#1c1917'; ctx.fillRect(fl.x + 13, fl.y - 14, 3, fl.h + 14);
    ctx.fillStyle = '#b91c1c';
    ctx.beginPath(); ctx.moveTo(fl.x + 16, fl.y - 14); ctx.lineTo(fl.x + 40, fl.y - 6); ctx.lineTo(fl.x + 16, fl.y + 2); ctx.fill();
  }

  // 敌人：订书机
  for (const f of foes) {
    if (!f.alive) continue;
    ctx.fillStyle = '#e05555'; ctx.fillRect(f.x, f.y, f.w, f.h - 6);
    ctx.fillStyle = '#8f2828'; ctx.fillRect(f.x, f.y + f.h - 6, f.w, 6);
    ctx.fillStyle = '#ede8df'; ctx.fillRect(f.x + 4, f.y + 5, 4, 4); ctx.fillRect(f.x + 14, f.y + 5, 4, 4);
  }

  // 玩家：纸狐狸（折纸风三角形组合）
  ctx.save();
  ctx.translate(P.x + P.w / 2, P.y + P.h / 2); ctx.scale(P.face, 1);
  ctx.fillStyle = '#ede8df'; ctx.strokeStyle = '#57534e';
  ctx.beginPath(); // 身体
  ctx.moveTo(-9, 10); ctx.lineTo(10, 8); ctx.lineTo(6, -4); ctx.lineTo(-8, -6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); // 头
  ctx.moveTo(2, -4); ctx.lineTo(12, -8); ctx.lineTo(10, 2); ctx.lineTo(2, 0); ctx.closePath();
  ctx.fillStyle = '#fffdf8'; ctx.fill(); ctx.stroke();
  ctx.beginPath(); // 耳朵
  ctx.moveTo(8, -8); ctx.lineTo(11, -14); ctx.lineTo(12, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#b91c1c'; ctx.fillRect(9, -5, 2.5, 2.5); // 眼
  ctx.restore();

  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.fillStyle = 'rgba(26,24,21,.72)'; ctx.fillRect(10, 10, 250, 34);
  ctx.fillStyle = '#ede8df'; ctx.font = '600 14px sans-serif';
  const mins = Math.floor(levelTime / 60), secs = Math.floor(levelTime % 60).toString().padStart(2, '0');
  ctx.fillText(`${LEVELS[level].name}   ⭐ ${levelStars}   ⏱ ${mins}:${secs}`, 20, 32);

  if (!started) overlay('纸上大冒险 PAPER TRAIL', '←→/AD 移动 · ↑/W/空格 跳 · R 重开', '点击或按任意键开始');
  if (finished) overlay('通关！ALL CLEAR', `总星星 ${starsTotal} · 总用时 ${Math.floor(totalTime / 60)}:${Math.floor(totalTime % 60).toString().padStart(2, '0')}`, '按 R 回到第一关');
}
function parallax(color, factor, amp, base) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, VIEW_H);
  for (let x = 0; x <= VIEW_W; x += 20) {
    const wx = x + CAM.x * factor;
    ctx.lineTo(x, base + Math.sin(wx * 0.008) * amp * 0.3 + Math.cos(wx * 0.02) * amp * 0.12 - amp * 0.2);
  }
  ctx.lineTo(VIEW_W, VIEW_H); ctx.closePath(); ctx.fill();
}
function overlay(title, sub, hint) {
  ctx.fillStyle = 'rgba(20,17,15,.82)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ede8df'; ctx.font = '700 44px Georgia, serif';
  ctx.fillText(title, VIEW_W / 2, VIEW_H / 2 - 40);
  ctx.fillStyle = '#d9a03f'; ctx.font = '16px sans-serif';
  ctx.fillText(sub, VIEW_W / 2, VIEW_H / 2 + 4);
  ctx.fillStyle = '#7a7367'; ctx.font = 'italic 14px Georgia, serif';
  ctx.fillText(hint, VIEW_W / 2, VIEW_H / 2 + 36);
  ctx.textAlign = 'left';
}

addEventListener('keydown', () => {
  if (!started) { started = true; loadLevel(0); }
  if (finished && keys) { /* R handled by restart binding */ }
});
cv.addEventListener('pointerdown', () => { if (!started) { started = true; loadLevel(0); } });

// R 键在通关后回第一关
addEventListener('keydown', e => { if (e.code === 'KeyR' && finished) { level = 0; starsTotal = 0; totalTime = 0; finished = false; started = true; loadLevel(0); } });

loadLevel(0);
loop(performance.now());
</script>
</body>
</html>
